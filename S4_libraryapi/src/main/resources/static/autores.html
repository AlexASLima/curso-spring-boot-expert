<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Autores - Library API</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            Library API
        </a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">
                Livros
            </a>
            <a class="nav-link active" href="/autores.html">
                Autores
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Autores</h2>
        <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalAutor">
            Novo Autor
        </button>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Data de Nascimento</th>
            <th>Nacionalidade</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="tabela-autores">
        </tbody>
    </table>
</div>

<!-- Modal Autor -->
<div class="modal fade" id="modalAutor" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Novo Autor
                </h5>
                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <div id="alerta-erro-autor"
                     class="alert alert-danger d-none"
                     style="white-space: pre-line;"
                     role="alert">
                </div>

                <form id="form-autor">
                    <div class="mb-3">
                        <label for="nome" class="form-label">
                            Nome
                        </label>
                        <input
                                type="text"
                                class="form-control"
                                id="nome">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="dataNascimento" class="form-label">
                            Data de Nascimento
                        </label>
                        <input
                                type="date"
                                class="form-control"
                                id="dataNascimento">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="nacionalidade" class="form-label">
                            Nacionalidade
                        </label>
                        <input
                                type="text"
                                class="form-control"
                                id="nacionalidade">
                        <div class="invalid-feedback"></div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button
                        type="button"
                        class="btn btn-primary"
                        id="btn-salvar-autor">
                    Salvar
                </button>
            </div>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
<script src="/js/autores.js"></script>

</body>
</html>
