<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Library API</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
            <span class="navbar-brand mb-0 h1">
                Library API
            </span>
    </div>
</nav>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Livros</h2>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalLivro">
            Novo Livro
        </button>
    </div>

    <table class="table table-striped table-hover">

        <thead class="table-dark">
        <tr>
            <th>ISBN</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Gênero</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="tabela-livros">
        </tbody>

    </table>

    <div class="modal fade" id="modalLivro" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Novo Livro</h5>
                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <div id="alerta-erro"
                         class="alert alert-danger d-none"
                         style="white-space: pre-line;"
                         role="alert">
                    </div>

                    <form id="form-livro">

                        <div class="mb-3">
                            <label for="isbn" class="form-label">
                                ISBN
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="isbn">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="titulo" class="form-label">
                                Título
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="titulo">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="dataPublicacao" class="form-label">
                                Data de publicação
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="dataPublicacao">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="genero" class="form-label">
                                Gênero
                            </label>

                            <select class="form-select" id="genero">
                                <option value="">Selecione...</option>
                                <option value="FICCAO">Ficção</option>
                                <option value="MISTERIO">Mistério</option>
                            </select>

                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">
                                Preço
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   id="preco">

                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="autor" class="form-label">
                                Autor
                            </label>

                            <select class="form-select" id="autor">
                                <option value="">Selecione...</option>
                            </select>

                            <div class="invalid-feedback"></div>
                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button
                            type="button"
                            class="btn btn-primary"
                            id="btn-salvar">
                        Salvar
                    </button>

                </div>

            </div>
        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/js/livros.js"></script>

</body>
</html>
